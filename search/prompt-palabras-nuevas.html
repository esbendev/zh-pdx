<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Generator</title>
  <style>
    :root {
      --bg: #f7f3ee;
      --panel: #ffffff;
      --border: #d6c9ba;
      --text: #1f1f1f;
      --muted: #5a5a5a;
      --accent: #3a5a8c;
      --accent-dark: #27456d;
      --button: #d9e4f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      padding: 24px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.8rem;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      transition: 0.2s ease;
      font-weight: 600;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .primary:hover {
      background: var(--accent-dark);
    }

    .secondary {
      background: var(--button);
      color: var(--text);
    }

    .secondary:hover {
      filter: brightness(0.98);
    }

    .output-wrap {
      margin-top: 20px;
    }

    #output {
      min-height: 320px;
      background: #faf7f3;
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 8px;
      display: block;
    }

    @media (max-width: 640px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Prompt Generator</h1>

    <form id="promptForm">
      <div class="grid">
        <div class="row">
          <div>
            <label for="dateInput">Date</label>
            <input id="dateInput" type="date" required />
          </div>

          <div>
            <label for="startIdInput">Start ID</label>
            <input id="startIdInput" type="number" min="1" value="338" required />
          </div>
        </div>

        <div>
          <label for="textInput">Text</label>
          <textarea id="textInput" placeholder="Paste the text you want to turn into Chinese vocabulary entries..." required></textarea>
          <span class="hint">Use a Thursday or Saturday date if that matches your schedule.</span>
        </div>

        <div class="actions">
          <button type="submit" class="primary">Generate Prompt</button>
          <button type="button" id="copyBtn" class="secondary">Copy Output</button>
        </div>
      </div>
    </form>

    <div class="output-wrap">
      <label for="output">Generated Prompt</label>
      <textarea id="output" readonly></textarea>
    </div>
  </main>

  <script>
    const form = document.getElementById('promptForm');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const date = document.getElementById('dateInput').value;
      const startId = Number(document.getElementById('startIdInput').value);
      const text = document.getElementById('textInput').value.trim();

      if (!date || !text || Number.isNaN(startId) || startId < 1) {
        output.value = 'Please fill in a valid date, start ID, and text.';
        return;
      }

      const prompt = [
        'Take chinese words from the following text and create entries using this structure.',
        '',
        '{',
        `    "id": ${startId},`,
        '    "contenido": "犹豫吃鱿鱼",',
        '    "significado": "hesitant to eat squid",',
        `    "dia": "${date}",`,
        '    "tags": [',
        '        "verbs",',
        '        "activities"',
        '    ],',
        '    "pinyin": "yóu yù chī yóu yú"',
        '}',
        '',
        `start at ${startId}`,
        '',
        `dia is ${date}`,
        '',
        'Text:',
        text
      ].join('\n');

      output.value = prompt;
    });

    copyBtn.addEventListener('click', async function () {
      if (!output.value) {
        return;
      }

      try {
        await navigator.clipboard.writeText(output.value);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.textContent = 'Copy Output';
        }, 1200);
      } catch (error) {
        copyBtn.textContent = 'Copy failed';
        setTimeout(() => {
          copyBtn.textContent = 'Copy Output';
        }, 1200);
      }
    });
  </script>
</body>
</html>
